# Site identity
locale: en-US
title: "Yihui Zhang (张艺辉) - Homepage"
name: "Yihui Zhang (张艺辉)"
description: "Yihui Zhang, PhD candidate at Beihang University. Research in cloud computing, distributed systems, and LLM training and inference."
url: "https://WilliamEricCheung.github.io"
baseurl: ""
repository: "WilliamEricCheung/WilliamEricCheung.github.io"
author:
  email: "zhangyihui@buaa.edu.cn"
  github: "WilliamEricCheung"
  orcid: "https://orcid.org/0009-0009-5768-0063"

# Content and GitHub Pages-compatible build settings
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - preview.cmd
  - "*.code-workspace"
  - tmp
  - vendor
  - images/profile-bak.png
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
collections:
  publications:
    output: true
    permalink: /publication/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: academic
timezone: America/Los_Angeles
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
